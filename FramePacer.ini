[FramePacer]
; 1 = on, 0 = off (restart the game after changing anything here)
Enabled=1

; Mode=1 (AUTO, recommended): the plugin measures how long your frames really
;   take and picks the smallest WHOLE-millisecond frame time your PC can hold
;   (2 ms = 500 FPS, 3 = ~333, 4 = 250, 5 = 200, ...). It follows your FPS as
;   it changes between areas, so the frame time the game sees stays constant.
; Mode=0 (FIXED): always use TargetFrameMs.
Mode=1

; Fixed mode: the frame time to enforce, in MILLISECONDS (whole numbers).
; Auto mode: only the starting point.
TargetFrameMs=4

; Auto mode limits. 2 = never faster than 500 FPS, 8 = never slower than 125 FPS.
MinFrameMs=2
MaxFrameMs=8

; Auto mode safety margin added to your measured frame time. If the jitter still
; shows up in busy areas, raise this (e.g. 0.3 or 0.5) so it picks a slower,
; safer target there.
HeadroomMs=0.15

; Tiny margin so the game never measures one millisecond short. Leave as is.
EpsilonMs=0.02

; The last part of each wait is busy-waited for accuracy. Raise (e.g. 2.0)
; if frame times look uneven; lower to reduce CPU use.
SpinMs=1.5

; 1 = write FramePacer.log next to the .asi (shows whether the hook installed
; and every time Auto mode changes its target)
Log=1
